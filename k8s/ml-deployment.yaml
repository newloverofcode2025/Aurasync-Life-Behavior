apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurasync-ml
  namespace: aurasync-prod
  labels:
    app: aurasync-ml
    tier: ml-microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aurasync-ml
  template:
    metadata:
      labels:
        app: aurasync-ml
        tier: ml-microservice
    spec:
      containers:
        - name: ml-engine
          image: ghcr.io/username/aurasync-ml:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aurasync-ml-service
  namespace: aurasync-prod
spec:
  type: ClusterIP
  selector:
    app: aurasync-ml
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aurasync-ml-hpa
  namespace: aurasync-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aurasync-ml
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aurasync-ingress
  namespace: aurasync-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - aurasync.example.com
      secretName: aurasync-tls-cert
  rules:
    - host: aurasync.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aurasync-web-service
                port:
                  number: 80
