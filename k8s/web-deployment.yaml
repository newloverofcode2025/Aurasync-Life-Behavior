apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurasync-web
  namespace: aurasync-prod
  labels:
    app: aurasync-web
    tier: frontend-gateway
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aurasync-web
  template:
    metadata:
      labels:
        app: aurasync-web
        tier: frontend-gateway
    spec:
      containers:
        - name: web-gateway
          image: ghcr.io/username/aurasync-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: aurasync-config
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aurasync-secrets
                  key: gemini-api-key
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aurasync-web-service
  namespace: aurasync-prod
  labels:
    app: aurasync-web
spec:
  type: ClusterIP
  selector:
    app: aurasync-web
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
